# fly.toml app configuration file generated for clearflow-backend on 2026-08-10T03:08:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clearflow-backend'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'npx prisma db push'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
